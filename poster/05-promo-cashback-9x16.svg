<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" font-family="'Montserrat', 'Poppins', 'Arial Black', sans-serif">
  <defs>
    <filter id="shL" x="-12%" y="-12%" width="135%" height="135%"><feDropShadow dx="16" dy="16" stdDeviation="0" flood-color="#111111"/></filter>
    <filter id="shM" x="-12%" y="-12%" width="135%" height="135%"><feDropShadow dx="10" dy="10" stdDeviation="0" flood-color="#111111"/></filter>
    <filter id="shS" x="-12%" y="-12%" width="135%" height="135%"><feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#111111"/></filter>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="22" cy="22" r="3.5" fill="#ffffff"/></pattern>
  </defs>

  <!-- BG: red -->
  <rect width="1080" height="1920" fill="#ff4b4b"/>
  <g opacity="0.14"><rect width="1080" height="1920" fill="url(#dots)"/></g>
  <g opacity="0.12">
    <rect x="-260" y="1420" width="1700" height="52" fill="#111111" transform="rotate(-14 540 1440)"/>
    <rect x="-260" y="1540" width="1700" height="52" fill="#111111" transform="rotate(-14 540 1560)"/>
    <rect x="-260" y="1660" width="1700" height="52" fill="#111111" transform="rotate(-14 540 1680)"/>
  </g>

  <!-- HEADER WORDMARK -->
  <g transform="translate(540,118)">
    <rect x="-360" y="-52" width="720" height="104" rx="52" fill="#ffffff" stroke="#111111" stroke-width="8" filter="url(#shM)"/>
    <circle cx="-290" cy="0" r="26" fill="#ff4b4b" stroke="#111111" stroke-width="6"/>
    <text x="-240" y="18" font-size="52" font-weight="900" fill="#111111" letter-spacing="1">JuraganKuota</text>
  </g>

  <!-- TITLE BADGE -->
  <g transform="translate(540,290)">
    <rect x="-470" y="-96" width="940" height="192" rx="26" fill="#111111" stroke="#111111" stroke-width="10" filter="url(#shL)"/>
    <text x="0" y="-6" text-anchor="middle" font-size="80" font-weight="900" fill="#ffffff" letter-spacing="1">JADI JURAGAN</text>
    <text x="0" y="70" text-anchor="middle" font-size="80" font-weight="900" fill="#ffd76a" letter-spacing="1">PPOB / PULSA</text>
  </g>

  <!-- HERO: earnings illustration -->
  <g transform="translate(0,520)">
    <!-- big prive badge -->
    <g transform="translate(540,110)">
      <rect x="-460" y="-140" width="920" height="280" rx="28" fill="#ffd76a" stroke="#111111" stroke-width="12" filter="url(#shL)"/>
      <text x="0" y="-58" text-anchor="middle" font-size="42" font-weight="900" fill="#111111">CASHBACK / KEUNTUNGAN</text>
      <text x="0" y="60" text-anchor="middle" font-size="150" font-weight="900" fill="#ff4b4b" stroke="#111111" stroke-width="3" paint-order="stroke">s/d 15%</text>
    </g>

    <!-- benefit cards row -->
    <g transform="translate(540,430)">
      <rect x="-460" y="-90" width="290" height="180" rx="20" fill="#ffffff" stroke="#111111" stroke-width="8" filter="url(#shM)"/>
      <text x="-315" y="-6" text-anchor="middle" font-size="64">🏆</text>
      <text x="-315" y="62" text-anchor="middle" font-size="26" font-weight="900" fill="#111111">Harga Grosir</text>

      <rect x="-145" y="-90" width="290" height="180" rx="20" fill="#38e8ff" stroke="#111111" stroke-width="8" filter="url(#shM)"/>
      <text x="0" y="-6" text-anchor="middle" font-size="64">⚡</text>
      <text x="0" y="62" text-anchor="middle" font-size="26" font-weight="900" fill="#111111">Proses Kilat</text>

      <rect x="170" y="-90" width="290" height="180" rx="20" fill="#0fbf72" stroke="#111111" stroke-width="8" filter="url(#shM)"/>
      <text x="315" y="-6" text-anchor="middle" font-size="64">💰</text>
      <text x="315" y="62" text-anchor="middle" font-size="26" font-weight="900" fill="#111111">Untung Besar</text>
    </g>

    <!-- floating sticker -->
    <g transform="translate(905,260) rotate(14)">
      <rect x="-205" y="-58" width="410" height="116" rx="18" fill="#38e8ff" stroke="#111111" stroke-width="7" filter="url(#shM)"/>
      <text x="0" y="16" text-anchor="middle" font-size="40" font-weight="900" fill="#111111">MODAL KECIL</text>
    </g>

    <!-- phone dashboard -->
    <g transform="translate(300,610)">
      <rect x="0" y="0" width="480" height="320" rx="40" fill="#f4f5f7" stroke="#111111" stroke-width="12" filter="url(#shL)"/>
      <rect x="18" y="18" width="444" height="284" rx="26" fill="#ffffff" stroke="#111111" stroke-width="5"/>
      <rect x="170" y="18" width="140" height="24" rx="12" fill="#111111"/>
      <text x="40" y="86" font-size="26" font-weight="900" fill="#666666">Pendapatan Bulan Ini</text>
      <text x="40" y="146" font-size="56" font-weight="900" fill="#111111">Rp 3.450.000</text>
      <!-- mini bar chart -->
      <rect x="44" y="180" width="56" height="60" rx="8" fill="#ffd76a" stroke="#111111" stroke-width="4"/>
      <rect x="120" y="150" width="56" height="90" rx="8" fill="#38e8ff" stroke="#111111" stroke-width="4"/>
      <rect x="196" y="196" width="56" height="44" rx="8" fill="#0fbf72" stroke="#111111" stroke-width="4"/>
      <rect x="272" y="130" width="56" height="110" rx="8" fill="#ff4b4b" stroke="#111111" stroke-width="4"/>
      <rect x="348" y="168" width="56" height="72" rx="8" fill="#7b5cff" stroke="#111111" stroke-width="4"/>
      <text x="244" y="288" text-anchor="middle" font-size="22" font-weight="900" fill="#666666">Naik terus tiap hari 📈</text>
    </g>

    <g transform="translate(150,830) rotate(-12)">
      <rect x="-200" y="-56" width="400" height="112" rx="18" fill="#ffffff" stroke="#111111" stroke-width="7" filter="url(#shM)"/>
      <text x="0" y="16" text-anchor="middle" font-size="36" font-weight="900" fill="#111111">TANPA STOK FISIK</text>
    </g>
  </g>

  <!-- FEATURE STRIP -->
  <g transform="translate(540,1560)">
    <rect x="-470" y="-96" width="940" height="192" rx="24" fill="#ffffff" stroke="#111111" stroke-width="9" filter="url(#shL)"/>
    <g>
      <circle cx="-380" cy="-38" r="22" fill="#ffd76a" stroke="#111111" stroke-width="5"/>
      <path d="M-391 -38 l9 9 l18 -18" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="-338" y="-26" font-size="34" font-weight="900" fill="#111111">Modal Kecil</text>

      <circle cx="120" cy="-38" r="22" fill="#38e8ff" stroke="#111111" stroke-width="5"/>
      <path d="M109 -38 l9 9 l18 -18" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="162" y="-26" font-size="34" font-weight="900" fill="#111111">Daftar Gratis</text>

      <circle cx="-380" cy="46" r="22" fill="#0fbf72" stroke="#111111" stroke-width="5"/>
      <path d="M-391 46 l9 9 l18 -18" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="-338" y="58" font-size="34" font-weight="900" fill="#111111">Dibimbing CS</text>

      <circle cx="120" cy="46" r="22" fill="#ff4b4b" stroke="#111111" stroke-width="5"/>
      <path d="M109 46 l9 9 l18 -18" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="162" y="58" font-size="34" font-weight="900" fill="#111111">Cuan Harian</text>
    </g>
  </g>

  <!-- CTA FOOTER -->
  <g transform="translate(540,1800)">
    <rect x="-460" y="-72" width="920" height="144" rx="26" fill="#0fbf72" stroke="#111111" stroke-width="10" filter="url(#shL)"/>
    <text x="0" y="-8" text-anchor="middle" font-size="44" font-weight="900" fill="#111111" letter-spacing="1">🔥 GABUNG SEKARANG</text>
    <text x="0" y="50" text-anchor="middle" font-size="46" font-weight="900" fill="#ffffff" stroke="#111111" stroke-width="2" paint-order="stroke" letter-spacing="3">JURAGANKUOTA.ID</text>
  </g>
</svg>
