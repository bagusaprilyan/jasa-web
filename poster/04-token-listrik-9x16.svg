<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" font-family="'Montserrat', 'Poppins', 'Arial Black', sans-serif">
  <defs>
    <filter id="shL" x="-12%" y="-12%" width="135%" height="135%"><feDropShadow dx="16" dy="16" stdDeviation="0" flood-color="#111111"/></filter>
    <filter id="shM" x="-12%" y="-12%" width="135%" height="135%"><feDropShadow dx="10" dy="10" stdDeviation="0" flood-color="#111111"/></filter>
    <filter id="shS" x="-12%" y="-12%" width="135%" height="135%"><feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#111111"/></filter>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="22" cy="22" r="3.5" fill="#ffffff"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BG: gold -->
  <rect width="1080" height="1920" fill="#ffd76a"/>
  <g opacity="0.16"><rect width="1080" height="1920" fill="url(#dots)"/></g>
  <g opacity="0.10">
    <rect x="-260" y="1420" width="1700" height="52" fill="#111111" transform="rotate(-14 540 1440)"/>
    <rect x="-260" y="1540" width="1700" height="52" fill="#111111" transform="rotate(-14 540 1560)"/>
    <rect x="-260" y="1660" width="1700" height="52" fill="#111111" transform="rotate(-14 540 1680)"/>
  </g>

  <!-- HEADER WORDMARK -->
  <g transform="translate(540,118)">
    <rect x="-360" y="-52" width="720" height="104" rx="52" fill="#ffffff" stroke="#111111" stroke-width="8" filter="url(#shM)"/>
    <circle cx="-290" cy="0" r="26" fill="#ff4b4b" stroke="#111111" stroke-width="6"/>
    <text x="-240" y="18" font-size="52" font-weight="900" fill="#111111" letter-spacing="1">JuraganKuota</text>
  </g>

  <!-- TITLE BADGE -->
  <g transform="translate(540,300)">
    <rect x="-470" y="-86" width="940" height="172" rx="26" fill="#111111" stroke="#111111" stroke-width="10" filter="url(#shL)"/>
    <text x="0" y="-4" text-anchor="middle" font-size="96" font-weight="900" fill="#ffd76a" letter-spacing="2">TOKEN LISTRIK</text>
    <text x="0" y="62" text-anchor="middle" font-size="40" font-weight="900" fill="#38e8ff" letter-spacing="3">PLN PRABAYAR • 24 JAM</text>
  </g>

  <!-- HERO -->
  <g transform="translate(0,520)">
    <!-- big lightning bolt + token card -->
    <g transform="translate(120,40)">
      <!-- token card -->
      <rect x="0" y="0" width="580" height="300" rx="28" fill="#ffffff" stroke="#111111" stroke-width="12" filter="url(#shL)"/>
      <text x="34" y="70" font-size="30" font-weight="900" fill="#666666">NOMOR METER / ID PELANGGAN</text>
      <rect x="34" y="92" width="512" height="90" rx="14" fill="#f4f5f7" stroke="#111111" stroke-width="6"/>
      <text x="60" y="150" font-size="46" font-weight="900" fill="#111111" letter-spacing="4">1122 3344 5566</text>
      <circle cx="90" cy="238" r="26" fill="#0fbf72" stroke="#111111" stroke-width="5"/>
      <path d="M78 238 l9 9 l18 -18" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="132" y="248" font-size="28" font-weight="900" fill="#111111">BUDI SANTOSO • R1/450VA</text>
    </g>

    <!-- lightning bolt illustration -->
    <g transform="translate(770,430)" filter="url(#glow)">
      <path d="M0 -230 L-130 30 L-20 30 L-70 250 L130 -40 L10 -40 L70 -230 Z" fill="#ff4b4b" stroke="#111111" stroke-width="12" stroke-linejoin="round"/>
    </g>

    <!-- floating price badge -->
    <g transform="translate(230,430) rotate(-8)">
      <rect x="-240" y="-72" width="480" height="144" rx="20" fill="#111111" stroke="#111111" stroke-width="8" filter="url(#shM)"/>
      <text x="0" y="-12" text-anchor="middle" font-size="30" font-weight="900" fill="#38e8ff">MULAI TOKEN</text>
      <text x="0" y="46" text-anchor="middle" font-size="54" font-weight="900" fill="#ffd76a">Rp 20.000</text>
    </g>

    <!-- phone pay -->
    <g transform="translate(300,700)">
      <rect x="0" y="0" width="480" height="220" rx="30" fill="#ffffff" stroke="#111111" stroke-width="12" filter="url(#shL)"/>
      <text x="50" y="80" font-size="28" font-weight="900" fill="#666666">Pilih Nominal:</text>
      <rect x="40" y="104" width="196" height="80" rx="14" fill="#ffd76a" stroke="#111111" stroke-width="5" filter="url(#shS)"/>
      <text x="138" y="154" text-anchor="middle" font-size="30" font-weight="900" fill="#111111">Rp 20.000</text>
      <rect x="252" y="104" width="188" height="80" rx="14" fill="#38e8ff" stroke="#111111" stroke-width="5" filter="url(#shS)"/>
      <text x="346" y="154" text-anchor="middle" font-size="30" font-weight="900" fill="#111111">Rp 50.000</text>
    </g>

    <!-- floating sticker (drawn last so it sits on top of everything) -->
    <g transform="translate(840,700) rotate(-8)">
      <rect x="-200" y="-56" width="400" height="112" rx="18" fill="#0fbf72" stroke="#111111" stroke-width="7" filter="url(#shM)"/>
      <text x="0" y="16" text-anchor="middle" font-size="40" font-weight="900" fill="#ffffff" stroke="#111111" stroke-width="2" paint-order="stroke">LANGSUNG MASUK</text>
    </g>
  </g>

  <!-- FEATURE STRIP -->
  <g transform="translate(540,1560)">
    <rect x="-470" y="-96" width="940" height="192" rx="24" fill="#ffffff" stroke="#111111" stroke-width="9" filter="url(#shL)"/>
    <g>
      <circle cx="-380" cy="-38" r="22" fill="#ffd76a" stroke="#111111" stroke-width="5"/>
      <path d="M-391 -38 l9 9 l18 -18" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="-338" y="-26" font-size="36" font-weight="900" fill="#111111">Token Resmi PLN</text>

      <circle cx="120" cy="-38" r="22" fill="#38e8ff" stroke="#111111" stroke-width="5"/>
      <path d="M109 -38 l9 9 l18 -18" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="162" y="-26" font-size="36" font-weight="900" fill="#111111">Struk Digital</text>

      <circle cx="-380" cy="46" r="22" fill="#0fbf72" stroke="#111111" stroke-width="5"/>
      <path d="M-391 46 l9 9 l18 -18" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="-338" y="58" font-size="36" font-weight="900" fill="#111111">Bayar QRIS</text>

      <circle cx="120" cy="46" r="22" fill="#ff4b4b" stroke="#111111" stroke-width="5"/>
      <path d="M109 46 l9 9 l18 -18" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="162" y="58" font-size="36" font-weight="900" fill="#111111">Tanpa Topup</text>
    </g>
  </g>

  <!-- CTA FOOTER -->
  <g transform="translate(540,1810)">
    <rect x="-460" y="-62" width="920" height="124" rx="62" fill="#111111" stroke="#111111" stroke-width="10" filter="url(#shL)"/>
    <text x="0" y="16" text-anchor="middle" font-size="52" font-weight="900" fill="#ffd76a" letter-spacing="3">🌐 JURAGANKUOTA.ID</text>
  </g>
</svg>
