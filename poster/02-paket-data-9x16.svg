<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" font-family="'Montserrat', 'Poppins', 'Arial Black', sans-serif">
  <defs>
    <filter id="shL" x="-12%" y="-12%" width="135%" height="135%"><feDropShadow dx="16" dy="16" stdDeviation="0" flood-color="#111111"/></filter>
    <filter id="shM" x="-12%" y="-12%" width="135%" height="135%"><feDropShadow dx="10" dy="10" stdDeviation="0" flood-color="#111111"/></filter>
    <filter id="shS" x="-12%" y="-12%" width="135%" height="135%"><feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#111111"/></filter>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="22" cy="22" r="3.5" fill="#ffffff"/></pattern>
  </defs>

  <!-- BG: cyan -->
  <rect width="1080" height="1920" fill="#38e8ff"/>
  <g opacity="0.18"><rect width="1080" height="1920" fill="url(#dots)"/></g>
  <g opacity="0.14">
    <rect x="-260" y="1440" width="1700" height="52" fill="#111111" transform="rotate(-14 540 1460)"/>
    <rect x="-260" y="1560" width="1700" height="52" fill="#111111" transform="rotate(-14 540 1580)"/>
    <rect x="-260" y="1680" width="1700" height="52" fill="#111111" transform="rotate(-14 540 1700)"/>
  </g>

  <!-- HEADER WORDMARK -->
  <g transform="translate(540,118)">
    <rect x="-360" y="-52" width="720" height="104" rx="52" fill="#ffffff" stroke="#111111" stroke-width="8" filter="url(#shM)"/>
    <circle cx="-290" cy="0" r="26" fill="#ff4b4b" stroke="#111111" stroke-width="6"/>
    <text x="-240" y="18" font-size="52" font-weight="900" fill="#111111" letter-spacing="1">JuraganKuota</text>
  </g>

  <!-- TITLE BADGE -->
  <g transform="translate(540,300)">
    <rect x="-470" y="-86" width="940" height="172" rx="26" fill="#111111" stroke="#111111" stroke-width="10" filter="url(#shL)"/>
    <text x="0" y="-4" text-anchor="middle" font-size="96" font-weight="900" fill="#38e8ff" letter-spacing="2">PAKET DATA</text>
    <text x="0" y="62" text-anchor="middle" font-size="40" font-weight="900" fill="#ffd76a" letter-spacing="4">SUPER MURAH &amp; CEPAT</text>
  </g>

  <!-- HERO: big data callout + phone -->
  <g transform="translate(0,520)">
    <!-- BIG PRICE/QUOTA CARD -->
    <g transform="translate(120,20)">
      <rect x="0" y="0" width="580" height="420" rx="30" fill="#ffffff" stroke="#111111" stroke-width="12" filter="url(#shL)"/>
      <rect x="34" y="34" width="512" height="120" rx="16" fill="#ffd76a" stroke="#111111" stroke-width="6"/>
      <text x="290" y="86" text-anchor="middle" font-size="34" font-weight="900" fill="#111111">MULAI DARI</text>
      <text x="290" y="136" text-anchor="middle" font-size="60" font-weight="900" fill="#111111">Rp 5.000-an</text>

      <text x="34" y="222" font-size="30" font-weight="900" fill="#111111">Semua Operator:</text>
      <g font-size="30" font-weight="900">
        <rect x="34" y="240" width="158" height="60" rx="12" fill="#ff4b4b" stroke="#111111" stroke-width="5"/>
        <text x="113" y="280" text-anchor="middle" fill="#ffffff" font-size="28">TELKOMSEL</text>
        <rect x="206" y="240" width="158" height="60" rx="12" fill="#38e8ff" stroke="#111111" stroke-width="5"/>
        <text x="285" y="280" text-anchor="middle" fill="#111111" font-size="28">INDOSAT</text>
        <rect x="378" y="240" width="168" height="60" rx="12" fill="#0fbf72" stroke="#111111" stroke-width="5"/>
        <text x="462" y="280" text-anchor="middle" fill="#111111" font-size="28">XL/AXIS</text>

        <rect x="34" y="316" width="158" height="60" rx="12" fill="#7b5cff" stroke="#111111" stroke-width="5"/>
        <text x="113" y="356" text-anchor="middle" fill="#ffffff" font-size="28">TRI</text>
        <rect x="206" y="316" width="158" height="60" rx="12" fill="#ffd76a" stroke="#111111" stroke-width="5"/>
        <text x="285" y="356" text-anchor="middle" fill="#111111" font-size="28">SMARTFREN</text>
        <rect x="378" y="316" width="168" height="60" rx="12" fill="#111111" stroke="#111111" stroke-width="5"/>
        <text x="462" y="356" text-anchor="middle" fill="#38e8ff" font-size="26">by.U</text>
      </g>
    </g>

    <!-- FLOATING STICKER -->
    <g transform="translate(905,300) rotate(14)">
      <rect x="-215" y="-58" width="430" height="116" rx="18" fill="#ff4b4b" stroke="#111111" stroke-width="7" filter="url(#shM)"/>
      <text x="0" y="16" text-anchor="middle" font-size="40" font-weight="900" fill="#ffffff" stroke="#111111" stroke-width="2" paint-order="stroke">KUOTA BANYAK</text>
    </g>

    <!-- PHONE -->
    <g transform="translate(300,470)">
      <rect x="0" y="0" width="480" height="560" rx="46" fill="#f4f5f7" stroke="#111111" stroke-width="12" filter="url(#shL)"/>
      <rect x="18" y="18" width="444" height="524" rx="30" fill="#ffffff" stroke="#111111" stroke-width="5"/>
      <rect x="170" y="18" width="140" height="24" rx="12" fill="#111111"/>
      <text x="40" y="80" font-size="24" font-weight="900" fill="#666666">← Pilih Produk</text>
      <text x="40" y="130" font-size="32" font-weight="900" fill="#111111">Paket Internet</text>

      <!-- plan rows -->
      <rect x="40" y="156" width="400" height="92" rx="14" fill="#ffd76a" stroke="#111111" stroke-width="5" filter="url(#shS)"/>
      <text x="64" y="200" font-size="28" font-weight="900" fill="#111111">10 GB / 30 Hari</text>
      <text x="416" y="214" text-anchor="end" font-size="34" font-weight="900" fill="#111111">Rp 55rb</text>

      <rect x="40" y="266" width="400" height="92" rx="14" fill="#38e8ff" stroke="#111111" stroke-width="5" filter="url(#shS)"/>
      <text x="64" y="310" font-size="28" font-weight="900" fill="#111111">25 GB / 30 Hari</text>
      <text x="416" y="324" text-anchor="end" font-size="34" font-weight="900" fill="#111111">Rp 95rb</text>

      <rect x="40" y="376" width="400" height="92" rx="14" fill="#0fbf72" stroke="#111111" stroke-width="5" filter="url(#shS)"/>
      <text x="64" y="420" font-size="28" font-weight="900" fill="#ffffff">50 GB / 30 Hari</text>
      <text x="416" y="434" text-anchor="end" font-size="34" font-weight="900" fill="#ffffff">Rp 145rb</text>
    </g>

    <!-- side sticker -->
    <g transform="translate(150,760) rotate(-12)">
      <rect x="-190" y="-56" width="380" height="112" rx="18" fill="#ffd76a" stroke="#111111" stroke-width="7" filter="url(#shM)"/>
      <text x="0" y="16" text-anchor="middle" font-size="38" font-weight="900" fill="#111111">AKTIF SEKEJAP</text>
    </g>
  </g>

  <!-- FEATURE STRIP -->
  <g transform="translate(540,1560)">
    <rect x="-470" y="-96" width="940" height="192" rx="24" fill="#111111" stroke="#111111" stroke-width="9" filter="url(#shL)"/>
    <g>
      <circle cx="-380" cy="-38" r="22" fill="#38e8ff" stroke="#111111" stroke-width="5"/>
      <path d="M-391 -38 l9 9 l18 -18" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="-338" y="-26" font-size="36" font-weight="900" fill="#ffffff">Kuota Resmi</text>

      <circle cx="120" cy="-38" r="22" fill="#ffd76a" stroke="#111111" stroke-width="5"/>
      <path d="M109 -38 l9 9 l18 -18" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="162" y="-26" font-size="36" font-weight="900" fill="#ffffff">Tanpa Antri</text>

      <circle cx="-380" cy="46" r="22" fill="#0fbf72" stroke="#111111" stroke-width="5"/>
      <path d="M-391 46 l9 9 l18 -18" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="-338" y="58" font-size="36" font-weight="900" fill="#ffffff">Bayar QRIS</text>

      <circle cx="120" cy="46" r="22" fill="#ff4b4b" stroke="#111111" stroke-width="5"/>
      <path d="M109 46 l9 9 l18 -18" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="162" y="58" font-size="36" font-weight="900" fill="#ffffff">Harga Grosir</text>
    </g>
  </g>

  <!-- CTA FOOTER -->
  <g transform="translate(540,1810)">
    <rect x="-460" y="-62" width="920" height="124" rx="62" fill="#ffffff" stroke="#111111" stroke-width="10" filter="url(#shL)"/>
    <text x="0" y="16" text-anchor="middle" font-size="52" font-weight="900" fill="#111111" letter-spacing="3">🌐 JURAGANKUOTA.ID</text>
  </g>
</svg>
