<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="'Montserrat', 'Poppins', 'Arial Black', sans-serif">
  <defs>
    <!-- Hard shadows untuk gaya Neo-Brutalism -->
    <filter id="shadowLg" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="16" dy="16" stdDeviation="0" flood-color="#111111"/>
    </filter>
    <filter id="shadowMd" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="10" dy="10" stdDeviation="0" flood-color="#111111"/>
    </filter>
    <filter id="shadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#111111"/>
    </filter>
  </defs>

  <!-- Background: Navy -->
  <rect width="1080" height="1920" fill="#0b1e4d"/>

  <!-- Grid pattern (Comic Dots) -->
  <g opacity="0.15">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="3" fill="#ffffff"/>
    </pattern>
    <rect width="1080" height="1920" fill="url(#grid)"/>
  </g>

  <!-- TITLE BADGES -->
  <g transform="translate(540, 160)">
    <rect x="-420" y="-70" width="840" height="140" rx="30" fill="#ffd76a" stroke="#111111" stroke-width="8" filter="url(#shadowLg)"/>
    <text x="0" y="15" text-anchor="middle" font-size="76" font-weight="900" fill="#111111" letter-spacing="1">PPOB TANPA SALDO!</text>
  </g>

  <!-- Phone Mockup -->
  <g transform="translate(240, 320)">
    <!-- Phone Case -->
    <rect x="0" y="0" width="600" height="1060" rx="48" fill="#ffffff" stroke="#111111" stroke-width="12" filter="url(#shadowLg)"/>
    <!-- Inner Screen -->
    <rect x="20" y="20" width="560" height="1020" rx="32" fill="#f4f5f7" stroke="#111111" stroke-width="6"/>
    <!-- Notch -->
    <rect x="200" y="20" width="200" height="30" rx="15" fill="#111111"/>

    <!-- SCREEN CONTENT (Neo-Brutalist UI sama persis dengan web asli) -->
    <!-- Header: Logo & Bantuan -->
    <rect x="40" y="80" width="300" height="60" rx="30" fill="#ffffff" stroke="#111111" stroke-width="5" filter="url(#shadowSm)"/>
    <!-- logo dot -->
    <circle cx="70" cy="110" r="12" fill="#ff4b4b" stroke="#111111" stroke-width="4"/>
    <text x="95" y="118" font-size="22" font-weight="900" fill="#111111">JuraganKuota</text>

    <rect x="380" y="80" width="140" height="60" rx="30" fill="#0fbf72" stroke="#111111" stroke-width="5" filter="url(#shadowSm)"/>
    <text x="450" y="118" text-anchor="middle" font-size="20" font-weight="800" fill="#111111">Bantuan</text>

    <!-- Main Card -->
    <rect x="40" y="170" width="480" height="840" rx="20" fill="#ffffff" stroke="#111111" stroke-width="6" filter="url(#shadowMd)"/>

    <!-- Card Title -->
    <text x="70" y="220" font-size="18" font-weight="800" fill="#666666">← Ganti Produk</text>

    <!-- Product Box (Paket Data) -->
    <rect x="70" y="240" width="420" height="140" rx="12" fill="#38e8ff" stroke="#111111" stroke-width="5" filter="url(#shadowSm)"/>
    <text x="95" y="285" font-size="28" font-weight="900" fill="#111111">Paket Data Internet</text>
    <rect x="95" y="310" width="150" height="36" rx="18" fill="#111111"/>
    <text x="170" y="334" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">PAKET DATA</text>
    <text x="465" y="340" text-anchor="end" font-size="34" font-weight="900" fill="#111111">Rp 25.999</text>

    <!-- Input Section -->
    <circle cx="85" cy="425" r="16" fill="#ffd76a" stroke="#111111" stroke-width="4"/>
    <text x="85" y="433" text-anchor="middle" font-size="18" font-weight="900" fill="#111111">1</text>
    <text x="115" y="433" font-size="22" font-weight="800" fill="#111111">Nomor HP Tujuan:</text>

    <!-- Input Box -->
    <rect x="70" y="460" width="420" height="75" rx="12" fill="#ffffff" stroke="#111111" stroke-width="5" filter="url(#shadowSm)"/>
    <text x="95" y="510" font-size="32" font-weight="800" fill="#111111">0812-3456-7890</text>

    <!-- Cek Nama Button -->
    <rect x="70" y="570" width="420" height="70" rx="12" fill="#ffd76a" stroke="#111111" stroke-width="5" filter="url(#shadowSm)"/>
    <text x="280" y="616" text-anchor="middle" font-size="22" font-weight="800" fill="#111111">🔍 Pilih Paket Data</text>

    <!-- Success Box (Cyan) -->
    <rect x="70" y="670" width="420" height="100" rx="12" fill="#0fbf72" stroke="#111111" stroke-width="5" filter="url(#shadowSm)"/>
    <text x="280" y="715" text-anchor="middle" font-size="20" font-weight="800" fill="#111111">Paket: 30GB / 30 Hari</text>
    <text x="280" y="745" text-anchor="middle" font-size="18" font-weight="700" fill="#111111">Semua Jaringan Telkomsel</text>

    <!-- Red Pay Button -->
    <rect x="70" y="795" width="420" height="90" rx="16" fill="#ff4b4b" stroke="#111111" stroke-width="6" filter="url(#shadowSm)"/>
    <text x="280" y="852" text-anchor="middle" font-size="26" font-weight="900" fill="#ffffff" stroke="#111111" stroke-width="2" paint-order="stroke">⚡ BAYAR SEKARANG</text>

    <!-- Footer Note -->
    <text x="280" y="930" text-anchor="middle" font-size="14" font-weight="700" fill="#666666">👉 QRIS otomatis muncul setelah klik</text>
  </g>

  <!-- FLOATING BRUTALIST BADGES (Untuk Reels/Story) -->
  <!-- Top Left -->
  <g transform="translate(200, 390) rotate(-12)">
    <rect x="-160" y="-45" width="320" height="90" rx="15" fill="#ff4b4b" stroke="#111111" stroke-width="6" filter="url(#shadowMd)"/>
    <text x="0" y="13" text-anchor="middle" font-size="30" font-weight="900" fill="#ffffff" stroke="#111111" stroke-width="2" paint-order="stroke">❌ TANPA TOPUP</text>
  </g>

  <!-- Mid Right -->
  <g transform="translate(880, 680) rotate(15)">
    <rect x="-180" y="-50" width="360" height="100" rx="15" fill="#38e8ff" stroke="#111111" stroke-width="6" filter="url(#shadowMd)"/>
    <text x="0" y="15" text-anchor="middle" font-size="34" font-weight="900" fill="#111111">KUOTA INSTAN</text>
  </g>

  <!-- Bottom Left -->
  <g transform="translate(210, 1100) rotate(-8)">
    <rect x="-150" y="-45" width="300" height="90" rx="15" fill="#0fbf72" stroke="#111111" stroke-width="6" filter="url(#shadowMd)"/>
    <text x="0" y="13" text-anchor="middle" font-size="26" font-weight="900" fill="#ffffff" stroke="#111111" stroke-width="2" paint-order="stroke">✅ 24 JAM OTOMATIS</text>
  </g>

  <!-- Decorative Stars Brutalist -->
  <path d="M120 700 l20-60 l20 60 l60 20 l-60 20 l-20 60 l-20-60 l-60-20 z" fill="#ffd76a" stroke="#111111" stroke-width="6" filter="url(#shadowSm)"/>
  <path d="M960 1150 l15-45 l15 45 l45 15 l-45 15 l-15 45 l-15-45 l-45-15 z" fill="#ff4b4b" stroke="#111111" stroke-width="6" filter="url(#shadowSm)"/>

  <!-- VALUE PROPS SECTION (Bottom) -->
  <g transform="translate(540, 1550)">
    <rect x="-420" y="-120" width="840" height="240" rx="30" fill="#ffffff" stroke="#111111" stroke-width="10" filter="url(#shadowLg)"/>
    
    <!-- Checklist items -->
    <!-- Item 1 -->
    <circle cx="-350" cy="-60" r="20" fill="#ffd76a" stroke="#111111" stroke-width="5"/>
    <path d="M-360 -60 l8 8 l16-16" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-310" y="-50" font-size="36" font-weight="900" fill="#111111">Tanpa Daftar Akun</text>

    <!-- Item 2 -->
    <circle cx="-350" cy="20" r="20" fill="#38e8ff" stroke="#111111" stroke-width="5"/>
    <path d="M-360 20 l8 8 l16-16" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-310" y="30" font-size="36" font-weight="900" fill="#111111">Bebas Topup Saldo &amp; Potongan</text>

    <!-- Item 3 -->
    <circle cx="-350" cy="100" r="20" fill="#0fbf72" stroke="#111111" stroke-width="5"/>
    <path d="M-360 100 l8 8 l16-16" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-310" y="110" font-size="36" font-weight="900" fill="#111111">Bayar QRIS, Kuota Langsung Aktif</text>
  </g>

  <!-- URL CTA (Footer) -->
  <g transform="translate(540, 1820)">
    <rect x="-420" y="-50" width="840" height="100" rx="50" fill="#ffd76a" stroke="#111111" stroke-width="8" filter="url(#shadowLg)"/>
    <text x="0" y="18" text-anchor="middle" font-size="46" font-weight="900" fill="#111111" letter-spacing="4">WWW.JURAGANKUOTA.ID</text>
  </g>

</svg>