  <!-- Ikon tag harga -->
  <path d="M975 560 l26 0 a6 6 0 0 1 6 6 l0 20 l-30 30 l-30-30 l0-20 a6 6 0 0 1 6-6 z" fill="url(#goldGrad)"/>
  <circle cx="1001" cy="577" r="5" fill="#fff"/>
  <text x="985" y="618" text-anchor="middle" fill="#0b1e4d" font-size="27" font-weight="900">%</text>
  <text x="985" y="668" text-anchor="middle" fill="#0b1e4d" font-size="13" font-weight="800">MURAH</text>

  <!-- Ikon kanan bawah: Cepat -->
