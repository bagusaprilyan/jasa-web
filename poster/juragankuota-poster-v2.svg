  <text x="376" y="542" fill="#a8c4ff" font-size="14" font-weight="600">19:08</text>
  <text x="704" y="542" text-anchor="end" fill="#a8c4ff" font-size="14">WiFi ▌</text>

  <!-- Saldo card -->
  <rect x="372" y="554" width="336" height="110" rx="18" fill="url(#cardGrad)" filter="url(#iconShadow)"/>
  <rect x="372" y="554" width="336" height="110" rx="18" fill="none" stroke="#3d6fd0" stroke-width="1.5"/>
  <text x="540" y="578" text-anchor="middle" fill="#a8c4ff" font-size="13" letter-spacing="2">SALDO ANDA</text>
  <text x="540" y="618" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="900">Rp 125.000</text>
  <!-- Status aktif -->
  <rect x="472" y="628" width="136" height="24" rx="12" fill="#0fbf72" opacity="0.2"/>
  <circle cx="492" cy="640" r="5" fill="#37e59a"/>
  <text x="505" y="645" fill="#37e59a" font-size="13" font-weight="600">Akun Aktif</text>

  <!-- Grid menu 2x3 -->
  <!-- Baris 1 -->
  <!-- PULSA -->
  <rect x="372" y="680" width="100" height="88" rx="16" fill="#ffffff" opacity="0.07"/>
  <rect x="372" y="680" width="100" height="88" rx="16" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
  <!-- Ikon pulsa: sinyal bars -->
  <rect x="399" y="710" width="10" height="18" rx="2" fill="#ffd76a"/>
  <rect x="413" y="704" width="10" height="24" rx="2" fill="#ffd76a"/>
  <rect x="427" y="697" width="10" height="31" rx="2" fill="#ffd76a"/>
