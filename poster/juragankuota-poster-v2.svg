  <!-- Ikon petir -->
  <polygon points="541,699 530,724 539,724 527,747 553,720 541,720 553,699" fill="#ffd76a"/>
  <text x="540" y="757" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">TOKEN PLN</text>

  <!-- DATA -->
  <rect x="608" y="680" width="100" height="88" rx="16" fill="#ffffff" opacity="0.07"/>
  <rect x="608" y="680" width="100" height="88" rx="16" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
