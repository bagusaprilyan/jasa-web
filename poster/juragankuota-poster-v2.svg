  <rect x="485" y="500" width="110" height="26" rx="13" fill="#060e2e"/>
  <circle cx="540" cy="513" r="6" fill="#1a2a5e"/>
  <circle cx="520" cy="513" r="3" fill="#1e3a6e"/>

