  <!-- Ikon receipt/struk -->
  <rect x="67" y="562" width="56" height="66" rx="6" fill="#1e6fd9"/>
  <line x1="78" y1="578" x2="112" y2="578" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="590" x2="112" y2="590" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="602" x2="100" y2="602" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
