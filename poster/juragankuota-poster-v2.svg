  <!-- QRIS -->
  <rect x="608" y="778" width="100" height="88" rx="16" fill="#ffffff" opacity="0.07"/>
  <rect x="608" y="778" width="100" height="88" rx="16" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
  <!-- Ikon QR (3 corner squares) -->
  <rect x="634" y="798" width="14" height="14" rx="3" fill="none" stroke="#ffd76a" stroke-width="2.5"/>
  <rect x="652" y="798" width="14" height="14" rx="3" fill="none" stroke="#ffd76a" stroke-width="2.5"/>
  <rect x="634" y="816" width="14" height="14" rx="3" fill="none" stroke="#ffd76a" stroke-width="2.5"/>
  <rect x="653" y="816" width="12" height="12" rx="2" fill="#ffd76a" opacity="0.5"/>
  <line x1="653" y1="800" x2="665" y2="800" stroke="#ffd76a" stroke-width="2"/>
  <line x1="636" y1="822" x2="648" y2="822" stroke="#ffd76a" stroke-width="2"/>
