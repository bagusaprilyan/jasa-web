  <polyline points="72,768 82,778 100,757" fill="none" stroke="#0fbf72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="85" y="848" text-anchor="middle" fill="#0b1e4d" font-size="13" font-weight="800">AMAN</text>

  <!-- Ikon kanan atas: Harga -->
