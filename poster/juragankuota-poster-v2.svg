  <line x1="527" y1="810" x2="527" y2="820" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="522" y1="815" x2="532" y2="815" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
