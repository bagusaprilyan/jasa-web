<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="'Poppins','Montserrat','Arial Black',sans-serif">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060e2e"/>
      <stop offset="45%" stop-color="#0b1e4d"/>
      <stop offset="100%" stop-color="#0d2d6e"/>
    </linearGradient>
    <!-- Glow radial -->
    <radialGradient id="glowCenter" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1e6fd9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#060e2e" stop-opacity="0"/>
    </radialGradient>
    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe480"/>
      <stop offset="100%" stop-color="#ffb020"/>
    </linearGradient>
    <!-- Green CTA gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#37e59a"/>
      <stop offset="100%" stop-color="#0fbf72"/>
    </linearGradient>
    <!-- Blue card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4fa8"/>
      <stop offset="100%" stop-color="#0d3080"/>
    </linearGradient>
    <!-- Phone screen gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3a8f"/>
      <stop offset="100%" stop-color="#0a1f5c"/>
    </linearGradient>
    <!-- Icon box shadow -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <!-- Glow filter for badge -->
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Blob blur -->
    <filter id="blobBlur"><feGaussianBlur stdDeviation="28"/></filter>
    <!-- Card shadow -->
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="1080" height="1350" fill="url(#bgGrad)"/>
  <rect width="1080" height="1350" fill="url(#glowCenter)"/>

  <!-- Blobs dekoratif -->
  <ellipse cx="120" cy="200" rx="220" ry="180" fill="#1e6fd9" opacity="0.13" filter="url(#blobBlur)"/>
  <ellipse cx="980" cy="900" rx="240" ry="200" fill="#ffd76a" opacity="0.08" filter="url(#blobBlur)"/>
  <ellipse cx="540" cy="680" rx="300" ry="260" fill="#1e6fd9" opacity="0.10" filter="url(#blobBlur)"/>
  <ellipse cx="80" cy="1100" rx="160" ry="140" fill="#37e59a" opacity="0.09" filter="url(#blobBlur)"/>
  <ellipse cx="1000" cy="200" rx="160" ry="140" fill="#7b5cff" opacity="0.10" filter="url(#blobBlur)"/>

  <!-- Grid titik dekoratif (dot pattern) -->
  <g opacity="0.06">
    <pattern id="dots" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.5" fill="#fff"/>
    </pattern>
    <rect width="1080" height="1350" fill="url(#dots)"/>
  </g>

  <!-- Garis lengkung dekoratif atas -->
  <path d="M-60 320 Q270 160 540 280 Q810 400 1140 240" stroke="#1e6fd9" stroke-width="1.5" fill="none" opacity="0.22"/>
  <path d="M-60 360 Q270 200 540 320 Q810 440 1140 280" stroke="#ffd76a" stroke-width="0.8" fill="none" opacity="0.12"/>

  <!-- ── HEADER ── -->
  <!-- Badge "24 JAM ONLINE" -->
  <rect x="300" y="52" width="480" height="52" rx="26" fill="#ffffff" opacity="0.10"/>
  <rect x="300" y="52" width="480" height="52" rx="26" fill="none" stroke="#ffd76a" stroke-width="1.5" opacity="0.4"/>
  <text x="540" y="85" text-anchor="middle" fill="#ffd76a" font-size="19" font-weight="700" letter-spacing="4">⚡ LAYANAN ONLINE 24 JAM</text>

  <!-- Logo pill -->
  <rect x="60" y="130" width="60" height="60" rx="18" fill="url(#goldGrad)" filter="url(#iconShadow)"/>
  <!-- Lightning bolt icon -->
  <polygon points="86,142 78,162 88,162 76,178 100,155 88,155 100,142" fill="#0b1e4d"/>

  <!-- Nama brand -->
  <text x="142" y="162" fill="#ffffff" font-size="42" font-weight="900" letter-spacing="1">JURAGAN</text>
  <text x="142" y="196" fill="url(#goldGrad)" font-size="28" font-weight="900" letter-spacing="10">KUOTA</text>

  <!-- Tagline kanan -->
  <text x="1020" y="158" text-anchor="end" fill="#ffffff" font-size="17" font-weight="400" opacity="0.7">Mudah · Cepat · Aman</text>
  <text x="1020" y="182" text-anchor="end" fill="#ffd76a" font-size="17" font-weight="600">juragankuota.id</text>

  <!-- Divider line -->
  <line x1="60" y1="220" x2="1020" y2="220" stroke="#ffffff" stroke-width="0.8" opacity="0.12"/>

  <!-- ── HERO TITLE ── -->
  <text x="540" y="298" text-anchor="middle" fill="#ffffff" font-size="92" font-weight="900" letter-spacing="-2">JURAGAN</text>
  <text x="540" y="380" text-anchor="middle" fill="url(#goldGrad)" font-size="92" font-weight="900" letter-spacing="-2">KUOTA</text>
  <!-- Garis bawah judul -->
  <rect x="200" y="396" width="680" height="4" rx="2" fill="url(#goldGrad)" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="540" y="440" text-anchor="middle" fill="#a8c4ff" font-size="22" font-weight="400" letter-spacing="2">Platform PPOB Terpercaya Indonesia</text>

  <!-- ── PHONE MOCKUP ── -->
  <!-- Phone body -->
  <rect x="340" y="474" width="400" height="620" rx="44" fill="#0a1530" filter="url(#cardShadow)"/>
  <rect x="340" y="474" width="400" height="620" rx="44" fill="none" stroke="#1e6fd9" stroke-width="2.5" opacity="0.6"/>
  <!-- Inner bezel -->
  <rect x="356" y="490" width="368" height="588" rx="34" fill="url(#screenGrad)"/>
